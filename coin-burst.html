<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金幣飛向錢包 — Coin burst</title>
<style>
  :root{
    --gold:#f2c14e;
    --gold-dim:#b19750;
    --green:#0f4f33;
    --green-ink:#5ee69a;
    --ink:#f3f5f4;
    --panel:#292929;
    --page:#141414;
    --ease-out: cubic-bezier(.22,.61,.36,1);
    --ease-back: cubic-bezier(.34,1.56,.64,1);
  }

  *{ box-sizing:border-box }
  html,body{ height:100% }
  body{
    margin:0;
    background:#0b0d0c;
    color:var(--ink);
    font:15px/1.4 ui-sans-serif,system-ui,"Noto Sans TC",sans-serif;
    display:grid; place-items:center;
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip-path:inset(50%); white-space:nowrap;
  }

  .hint{
    position:fixed; inset-inline:0; top:0; z-index:99;
    margin:0; padding:10px 16px;
    background:#7f1d1d; color:#fff; font-size:13px; text-align:center;
  }

  /* ---------- 手機外框 ---------- */
  .phone{
    position:relative; isolation:isolate;
    width:min(390px,100vw); height:min(780px,100dvh);
    background:var(--page);
    overflow:hidden;
    display:flex; flex-direction:column;
  }

  /* ---------- 頂部列 ---------- */
  .topbar{
    position:relative; z-index:3;
    display:flex; align-items:center; gap:8px;
    padding:10px 12px;
    background:var(--page);
  }
  .brand{ font-weight:800; font-size:20px; letter-spacing:-.5px }
  .brand i{ color:#e5342a; font-style:normal }

  .wallet{
    display:flex; align-items:center; gap:6px;
    margin-inline-start:auto;
    padding:5px 8px 5px 6px;
    border-radius:8px 0 0 8px;
    background:var(--panel);
    border:1px solid transparent;
    transition:border-color .25s, box-shadow .25s;
  }
  /* 金幣抵達時的高亮：只動 border-color / box-shadow，不動 layout */
  .wallet.is-receiving{
    border-color:var(--gold);
    box-shadow:0 0 0 1px rgba(242,193,78,.35), 0 0 14px rgba(242,193,78,.25);
  }
  .wallet__icon{ width:20px; height:20px; display:block }
  .wallet__amount{
    font-variant-numeric:tabular-nums;   /* 數字跳動時寬度不會抖 */
    font-weight:600; font-size:14px; letter-spacing:.2px;
  }
  .wallet__caret{ opacity:.6 }
  .plus{
    all:unset; cursor:pointer;
    display:grid; place-items:center;
    width:34px; align-self:stretch;
    border-radius:0 8px 8px 0;
    background:#1f9c63; color:#fff; font-size:20px; font-weight:600;
  }
  .avatar{ width:26px; height:26px; border-radius:50%; background:#2f7d55 }
  .avatar.flag{ background:linear-gradient(#ff9933 33%,#fff 33% 66%,#138808 66%) }

  /* ---------- 綠色 toast ---------- */
  .toast{
    position:absolute; z-index:4; top:48px; left:50%;
    translate:-50% 0;
    padding:5px 16px; border-radius:999px;
    background:var(--green); color:var(--green-ink);
    font-weight:700; font-size:14px; font-variant-numeric:tabular-nums;
    opacity:0; scale:.9;
    transition:opacity .28s var(--ease-out), scale .28s var(--ease-back);
    pointer-events:none;
  }
  .toast.is-on{ opacity:1; scale:1 }

  /* ---------- 底下的促銷頁 ---------- */
  .page{
    flex:1; position:relative; overflow:hidden; padding:14px;
    background:radial-gradient(120% 70% at 50% 8%, #2c6b3f 0%, #14301f 55%, #0d1a12 100%);
  }
  .promo{
    position:relative; border-radius:14px; overflow:hidden;
    padding:18px 16px 22px;
    background:linear-gradient(145deg,#1d4b2e,#0f2a1a 70%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .promo__tag{
    display:inline-block; padding:3px 10px; border-radius:4px;
    background:#c0272d; color:#fff; font-size:10px; font-weight:800; letter-spacing:.5px;
  }
  .promo__big{ margin:10px 0 0; font-size:30px; font-weight:900; line-height:1; color:#ffd84d }
  .promo__sub{ margin:4px 0 0; font-size:13px; opacity:.85 }
  .promo__pct{
    position:absolute; right:10px; top:2px;
    font-size:64px; font-weight:900; color:#ffdb5c; opacity:.9;
    text-shadow:0 0 28px rgba(255,219,92,.55);
  }
  .card{
    margin-top:14px; padding:14px; border-radius:14px;
    background:#14331f; box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .card__row{ display:flex; align-items:center; justify-content:space-between; font-size:12px; opacity:.85 }
  .tiles{
    position:relative; margin-top:14px;
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
  }
  .tile{
    aspect-ratio:1; border-radius:12px;
    background:linear-gradient(150deg,#1b4630,#102a1c);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
    display:grid; place-items:center;
    font-size:26px;
  }
  .claim{
    all:unset; cursor:pointer; display:block;
    margin-top:14px; padding:13px; border-radius:10px;
    background:linear-gradient(#26b374,#148a58);
    color:#fff; font-weight:800; text-align:center;
  }
  .claim:focus-visible{ outline:2px solid var(--gold); outline-offset:3px }
  .claim[disabled]{ opacity:.5; cursor:default }

  /* ---------- 領獎 overlay ---------- */
  .reward{
    position:absolute; inset:0; z-index:2;
    display:grid; place-items:center;
    background:rgba(6,12,8,.66);
    backdrop-filter:blur(7px) saturate(.8);
    opacity:0; visibility:hidden;
    transition:opacity .4s var(--ease-out), visibility .4s;
  }
  .reward.is-on{ opacity:1; visibility:visible }

  .reward__inner{ position:relative; display:grid; place-items:center; width:100% }

  /* 放射光線：純 CSS，用 repeating-conic-gradient + 遮罩 */
  .rays{
    position:absolute; left:50%; top:58%;
    width:92%; aspect-ratio:1;
    translate:-50% -50%;
    background:
      radial-gradient(circle, rgba(255,214,110,.28) 0 14%, rgba(255,214,110,0) 52%),
      repeating-conic-gradient(from 0deg,
        rgba(255,243,196,.5) 0deg .55deg,
        rgba(255,243,196,0) .6deg 7.2deg);
    -webkit-mask:radial-gradient(circle, #0000 6%, #000 24%, #0000 60%);
            mask:radial-gradient(circle, #0000 6%, #000 24%, #0000 60%);
  }
  /* 只有 overlay 開著才跑：無限動畫留在隱藏元素上會一直吃合成資源 */
  .reward.is-on .rays{
    /* rotate / scale 是各自獨立的 CSS 屬性，兩個動畫不會互搶 transform */
    animation:rays-spin 34s linear infinite, rays-breathe 3.4s ease-in-out infinite;
  }
  @keyframes rays-spin{ to{ rotate:360deg } }
  @keyframes rays-breathe{ 50%{ scale:1.08; opacity:.72 } }

  .reward__title{ margin:0; font-size:30px; font-weight:800; letter-spacing:-.5px }
  .reward__amount{ margin:2px 0 6px; font-size:19px; font-weight:700; color:#ffd84d }

  .box{ width:180px; display:block; overflow:visible; filter:drop-shadow(0 10px 22px rgba(0,0,0,.55)) }
  .reward.is-on .box{ animation:box-in .5s var(--ease-back) both }
  @keyframes box-in{ from{ scale:.4; opacity:0 } }

  /* 盒蓋浮動 + 開箱時往上彈 */
  .box__lid{ transform-box:fill-box; transform-origin:50% 80% }
  .reward.is-on .box__lid{ animation:lid-pop .5s var(--ease-back) both, lid-float 2.6s 0.5s ease-in-out infinite }
  @keyframes lid-pop{ from{ translate:0 24px; rotate:0deg } to{ translate:0 0; rotate:-5deg } }
  @keyframes lid-float{ 50%{ translate:0 -6px; rotate:-2deg } }

  /* 開箱瞬間的白色衝擊環 */
  .shock{
    position:absolute; left:50%; top:58%; width:150px; aspect-ratio:1;
    translate:-50% -50%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,246,214,.95) 0 38%, rgba(255,214,110,.5) 58%, rgba(255,214,110,0) 72%);
    opacity:0; pointer-events:none;
  }
  .reward.is-on .shock{ animation:shock .5s var(--ease-out) both }
  @keyframes shock{ from{ scale:.25; opacity:.95 } to{ scale:2; opacity:0 } }

  .replay{
    all:unset; cursor:pointer; position:absolute; bottom:10px; left:50%;
    translate:-50% 0; z-index:5;
    padding:8px 16px; border-radius:999px;
    background:#ffffff14; font-size:13px;
  }
  .replay:focus-visible{ outline:2px solid var(--gold); outline-offset:3px }

  @media (prefers-reduced-motion: reduce){
    .rays{ animation:none }
    .reward.is-on .box,
    .reward.is-on .box__lid,
    .reward.is-on .shock{ animation:none }
    .box__lid{ rotate:-5deg }
    *{ transition-duration:1ms !important }
  }
</style>
</head>
<body>

<p class="hint" id="hint" hidden>
  這頁用 ES module 載入 <code>coin-fly.js</code>，file:// 會被 CORS 擋。
  請在資料夾裡跑 <code>python3 -m http.server</code> 再開 <code>http://localhost:8000/coin-burst.html</code>。
</p>

<div class="phone">

  <header class="topbar">
    <span class="brand">ba<i>j</i>i</span>

    <div class="wallet" id="wallet">
      <svg class="wallet__icon" id="walletIcon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10" fill="#f0b429"/>
        <circle cx="12" cy="12" r="7" fill="#d69412"/>
        <text x="12" y="16.5" text-anchor="middle" font-size="11" font-weight="700" fill="#fff6d8">$</text>
      </svg>
      <span class="wallet__amount" id="amount">2,008,100.00</span>
      <span class="wallet__caret" aria-hidden="true">⌄</span>
    </div>
    <button class="plus" type="button" aria-label="Deposit">+</button>
    <span class="avatar" aria-hidden="true"></span>
    <span class="avatar flag" aria-hidden="true"></span>
  </header>

  <div class="toast" id="toast" aria-hidden="true">+$33.00</div>

  <main class="page">
    <section class="promo">
      <span class="promo__tag">JUST 1X WAGERING!</span>
      <p class="promo__big">UP TO<br>6% EXTRA</p>
      <p class="promo__sub">ON EVERY DEPOSIT</p>
      <span class="promo__pct" aria-hidden="true">6%</span>
    </section>

    <section class="card">
      <div class="card__row"><span>TODAY · Sep 17</span><span>Total in Vault <b>$934</b></span></div>
      <div class="card__row" style="margin-top:8px"><span>Claimed Today</span><span>$33.00</span></div>
      <button class="claim" id="claim" type="button">Claim +$33.00</button>
    </section>

    <section class="tiles" aria-label="Games">
      <div class="tile">🎰</div><div class="tile">🃏</div><div class="tile">🎲</div>
      <div class="tile">⚽</div><div class="tile">🏏</div><div class="tile">🎯</div>
      <div class="tile">🀄</div><div class="tile">💎</div><div class="tile">🔥</div>
    </section>
  </main>

  <!-- overlay 純裝飾，結果另外用 live region 播報 -->
  <div class="reward" id="reward" aria-hidden="true">
    <div class="reward__inner">
      <div class="rays"></div>
      <div class="shock"></div>
      <h2 class="reward__title">Claimed!</h2>
      <p class="reward__amount">+$33.00</p>

      <svg class="box" id="box" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="gTop" x1=".1" y1="0" x2=".9" y2="1">
            <stop offset="0" stop-color="#fff0b4"/><stop offset=".55" stop-color="#f7cf62"/>
            <stop offset="1" stop-color="#dda52f"/>
          </linearGradient>
          <linearGradient id="gLeft" x1="0" y1="0" x2=".3" y2="1">
            <stop offset="0" stop-color="#f2c854"/><stop offset="1" stop-color="#ad7213"/>
          </linearGradient>
          <linearGradient id="gRight" x1="1" y1="0" x2=".6" y2="1">
            <stop offset="0" stop-color="#b8861f"/><stop offset="1" stop-color="#70460a"/>
          </linearGradient>
          <linearGradient id="gRibbon" x1="0" y1="0" x2=".4" y2="1">
            <stop offset="0" stop-color="#fff3c2"/><stop offset=".5" stop-color="#ffd257"/>
            <stop offset="1" stop-color="#e09b1c"/>
          </linearGradient>
          <radialGradient id="gCoin" cx=".34" cy=".28" r=".85">
            <stop offset="0" stop-color="#fffbe2"/><stop offset=".38" stop-color="#ffdd77"/>
            <stop offset=".72" stop-color="#eeb63f"/><stop offset="1" stop-color="#9c6510"/>
          </radialGradient>
          <radialGradient id="gGlow" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#ffe9a0" stop-opacity=".9"/>
            <stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- 盒口的暖光 -->
        <ellipse cx="100" cy="106" rx="66" ry="26" fill="url(#gGlow)"/>

        <!-- 盒身 -->
        <g stroke="#6d430a" stroke-width="1.2" stroke-linejoin="round">
          <path d="M38 112 100 92 162 112 100 132Z" fill="#5c380a"/>
          <path d="M38 112 38 152 100 174 100 132Z" fill="url(#gLeft)"/>
          <path d="M162 112 162 152 100 174 100 132Z" fill="url(#gRight)"/>
          <!-- 垂直緞帶（左右兩面各一條） -->
          <path d="M76 124 76 164 100 172 100 132Z" fill="url(#gRibbon)" opacity=".95"/>
          <path d="M124 124 124 164 100 172 100 132Z" fill="url(#gRibbon)" opacity=".8"/>
        </g>

        <!-- 溢出的金幣堆 -->
        <g id="pile" stroke="#8a5a12" stroke-width="1">
          <circle cx="70"  cy="110" r="10" fill="url(#gCoin)"/>
          <circle cx="130" cy="110" r="10" fill="url(#gCoin)"/>
          <circle cx="88"  cy="116" r="11" fill="url(#gCoin)"/>
          <circle cx="112" cy="116" r="11" fill="url(#gCoin)"/>
          <circle cx="100" cy="104" r="11" fill="url(#gCoin)"/>
          <circle cx="78"  cy="100" r="9"  fill="url(#gCoin)"/>
          <circle cx="122" cy="100" r="9"  fill="url(#gCoin)"/>
          <circle cx="100" cy="120" r="9"  fill="url(#gCoin)"/>
        </g>

        <!-- 盒蓋（漂浮） -->
        <g class="box__lid" stroke="#6d430a" stroke-width="1.2" stroke-linejoin="round">
          <path d="M30 62 100 40 170 62 100 84Z" fill="url(#gTop)"/>
          <path d="M30 62 30 76 100 98 100 84Z" fill="url(#gLeft)"/>
          <path d="M170 62 170 76 100 98 100 84Z" fill="url(#gRight)"/>
          <!-- 蓋子上的十字緞帶 -->
          <path d="M100 40 170 62 100 84 30 62Z" fill="none"/>
          <path d="M86 44 100 40 170 62 156 66Z" fill="url(#gRibbon)" opacity=".92"/>
          <path d="M114 44 100 40 30 62 44 66Z" fill="url(#gRibbon)" opacity=".92"/>
          <path d="M100 84 100 98 114 94 114 80Z" fill="url(#gRibbon)"/>
          <!-- 蝴蝶結：兩個環 + 結 + 兩條尾巴 -->
          <path d="M98 40C84 20 58 18 56 30c-2 12 24 18 42 10Z" fill="url(#gRibbon)"/>
          <path d="M102 40c14-20 40-22 42-10 2 12-24 18-42 10Z" fill="url(#gRibbon)"/>
          <path d="M96 42c-10 8-18 20-14 24 5 5 14-10 18-20Z" fill="url(#gRibbon)" opacity=".85"/>
          <path d="M104 42c10 8 18 20 14 24-5 5-14-10-18-20Z" fill="url(#gRibbon)" opacity=".85"/>
          <ellipse cx="100" cy="40" rx="8" ry="7" fill="#ffe692"/>
        </g>
      </svg>
    </div>

    <button class="replay" id="replay" type="button">再播一次</button>
  </div>

  <p class="sr-only" role="status" id="live"></p>
</div>

<script type="module">
  let flyCoins;
  try {
    ({ flyCoins } = await import('./coin-fly.js'));
  } catch (err) {
    document.getElementById('hint').hidden = false;
    throw err;
  }

  const $ = (id) => document.getElementById(id);
  const reward = $('reward'), wallet = $('wallet'), walletIcon = $('walletIcon');
  const amountEl = $('amount'), toast = $('toast'), claim = $('claim'), replay = $('replay'), live = $('live');

  const COINS = 30;
  const PRIZE = 33;
  const money = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  let balance = 2008100;
  let running = null;          // 目前這輪的 AbortController

  /** 每顆金幣抵達時的目標端回饋：數字往上跳 + 膠囊彈一下 */
  function makeReceiver(from, to, count) {
    let landed = 0;
    return (i) => {
      landed++;
      const value = landed >= count ? to : from + (to - from) * (landed / count);
      amountEl.textContent = money.format(value);
      wallet.animate(
        [{ scale: '1' }, { scale: '1.055' }, { scale: '1' }],
        { duration: 220, easing: 'ease-out' },
      );
    };
  }

  async function play() {
    running?.abort();
    const ctrl = new AbortController();
    running = ctrl;
    const { signal } = ctrl;

    const from = balance;
    const to = balance + PRIZE;

    claim.disabled = true;
    amountEl.textContent = money.format(from);
    reward.classList.add('is-on');
    live.textContent = '';

    await wait(420, signal);
    if (signal.aborted) return;

    wallet.classList.add('is-receiving');
    toast.classList.add('is-on');

    const flight = flyCoins({
      from: $('pile'),            // 從金幣堆噴出
      to: walletIcon,             // 飛進錢包 icon
      count: COINS,
      duration: 380,
      stagger: 34,
      spread: 42,
      size: 24,
      signal,
      onArrive: makeReceiver(from, to, COINS),
    });

    await flight.finished;
    if (signal.aborted) return;

    balance = to;
    amountEl.textContent = money.format(balance);
    live.textContent = `已領取 +$${PRIZE}.00，餘額 ${money.format(balance)}`;

    await wait(420, signal); if (signal.aborted) return;
    wallet.classList.remove('is-receiving');

    await wait(380, signal); if (signal.aborted) return;
    toast.classList.remove('is-on');
    reward.classList.remove('is-on');
    claim.disabled = false;
    running = null;
  }

  function wait(ms, signal) {
    return new Promise((resolve) => {
      const id = setTimeout(resolve, ms);
      signal?.addEventListener('abort', () => { clearTimeout(id); resolve(); }, { once: true });
    });
  }

  claim.addEventListener('click', play);
  replay.addEventListener('click', () => {
    balance = 2008100;
    amountEl.textContent = money.format(balance);
    play();
  });
</script>

</body>
</html>
