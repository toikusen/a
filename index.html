<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG Path animated Text</title>
<style>
  /* --len / --off 註冊成真正的 <length>，就不必再寫 calc(var(--len) * 1px) 這種 hack，
     而且瀏覽器知道它們可以插值。--total 由 JS 用 getTotalLength() 填，避免手寫長度。 */
  @property --len   { syntax: "<length>"; inherits: false; initial-value: 0px }
  @property --off   { syntax: "<length>"; inherits: false; initial-value: 0px }
  @property --total { syntax: "<length>"; inherits: true;  initial-value: 0px }

  :root {
    --bg: #5677fc;
    --ink: #f5f6f7;
    --ease: cubic-bezier(0.445, 0.05, 0.55, 0.95);
  }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    background: var(--bg);
  }

  .stage {
    all: unset;             /* 用 button 取得鍵盤可操作性，外觀自己畫 */
    cursor: pointer;
    display: block;
  }
  .stage:focus-visible { outline: 2px solid var(--ink); outline-offset: 8px; }

  .logo {
    display: block;
    width: min(600px, 90vw);
    aspect-ratio: 3 / 2;
  }

  /* 每個筆劃只是同一條路徑的一段：--off 是起點，--len 是長度。
     這裡寫的是「畫完」的樣子 —— 也就是沒有動畫時的安全狀態：
     JS 沒跑、或使用者要求減少動態時，看到的是完整的 Design，而不是一片空白。 */
  .logo use {
    fill: none;
    stroke: var(--ink);
    stroke-width: 2px;
    stroke-linecap: round;
    stroke-dasharray: var(--len) var(--total);
    stroke-dashoffset: calc(0px - var(--off));
  }
</style>
</head>
<body>

<button class="stage" type="button" id="stage" aria-label="暫停動畫">
  <svg class="logo" id="logo" viewBox="0 0 300 200" role="img" aria-label="Design">
    <defs>
      <path id="stroke" d="
        M  0,  0
        C  0,  0  99,  1  99, 89
        L 99,111
        C 99,130  75,112  99,112
        C103,112 100,112 106,112
        C121,112 121, 89 105, 89
        C 88, 89 102, 89  99, 89
        C  0, 89  80,103 123,103
        C128,103 135,103 136,103
        C155,103 137,140 137,103
        C137, 92 123, 93 123,103
        C123,115 135,113 137,110
        C152, 86 103, 87 143,110
        C152,116 157,106 147,103
        C140,102 143, 93 152, 96
        C206,118 159.5,50 159,89
        L159,112
        C159,180 117, 93 168,118
        C176,122 180,116 180,115
        C183,107 169,101 168, 90
        C167, 77 180, 67 180, 95
        L180,103
        C180,115 166,115 166,103
        C166, 92 180, 94 180,102
        C180,180 188,125 188,112
        C188,110 188,100 188, 96
        C188, 91 189, 80 194, 91
        C200,101 186,134 188,106
        C189, 93 201, 93 201,100
        C201,105 201,105 201,112
        C201,130 220,160 300, 80
      "/>
    </defs>
    <!-- 筆劃由 JS 依 SEGMENTS 產生 -->
  </svg>
</button>

<script>
  // [起點 offset, 筆劃長度]，沿著 #stroke 依序取樣
  const SEGMENTS = [
    [149, 22], [201.3, 49],     // d
    [377.5, 14], [431.2, 43],   // e
    [526, 37],                  // s
    [631, 0.1], [637.5, 16],    // i
    [732.5, 15], [812, 69],     // g
    [941, 17], [1013, 33.5],    // n
  ];

  const DRAW = 5500;            // 畫完一次要多久
  const HOLD = 1500;            // 畫完 / 擦完後停留多久
  const EASE = "cubic-bezier(0.445, 0.05, 0.55, 0.95)";
  const SVG_NS = "http://www.w3.org/2000/svg";

  const logo = document.getElementById("logo");
  const stage = document.getElementById("stage");
  const path = document.getElementById("stroke");

  // 路徑總長由瀏覽器算，不用手寫。改 d 屬性不會再默默壞掉。
  // （dasharray 的第二個值就是「空白」，必須 >= 路徑長，否則圖案會沿路徑重複出現。）
  const TOTAL = path.getTotalLength();
  logo.style.setProperty("--total", TOTAL + "px");

  const strokes = SEGMENTS.map(([off, len]) => {
    const use = document.createElementNS(SVG_NS, "use");
    use.setAttribute("href", "#stroke");
    use.style.setProperty("--off", off + "px");
    use.style.setProperty("--len", len + "px");
    return use;
  });
  logo.append(...strokes);

  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    // 一圈 = 畫 → 停 → 擦 → 停。整個節奏交給動畫引擎，
    // 不再用 setInterval 去「猜」transition 什麼時候結束（分頁切換後就會對不上）。
    const cycle = (DRAW + HOLD) * 2;
    const at = (ms) => ms / cycle;

    const animations = strokes.map((use, i) => {
      const [off, len] = SEGMENTS[i];
      const blank = { strokeDasharray: `0px ${TOTAL}px`, strokeDashoffset: "0px" };
      const drawn = { strokeDasharray: `${len}px ${TOTAL}px`, strokeDashoffset: `${-off}px` };
      return use.animate(
        [
          { ...blank, offset: 0, easing: EASE },
          { ...drawn, offset: at(DRAW) },
          { ...drawn, offset: at(DRAW + HOLD), easing: EASE },
          { ...blank, offset: at(DRAW * 2 + HOLD) },
          { ...blank, offset: 1 },
        ],
        { duration: cycle, iterations: Infinity },
      );
    });

    stage.addEventListener("click", () => {
      const playing = animations[0].playState === "running";
      for (const a of animations) playing ? a.pause() : a.play();
      stage.setAttribute("aria-label", playing ? "播放動畫" : "暫停動畫");
    });
  } else {
    stage.hidden = true;        // 沒有動畫可以播放，按鈕就沒有意義
    document.body.append(logo); // 直接顯示畫好的 Design
  }
</script>

</body>
</html>
